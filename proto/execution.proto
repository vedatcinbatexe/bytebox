syntax = "proto3";

package bytebox.execution.v1;

option csharp_namespace = "Bytebox.Execution.Grpc";

service ExecutionService {
  // Queue code for execution and return the new run id
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);

  // Get the current state of a run
  rpc GetRun(GetRunRequest) returns (Run);

  // Send the current state, then every update until the run is finished
  rpc StreamRun(GetRunRequest) returns (stream Run);

  // A user's most recent runs, newest first
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
}

message ListRunsRequest {
  string user_id = 1;
  int32 limit = 2; // 1-100, default 20
}

message ListRunsResponse {
  repeated Run runs = 1;
}

message CreateRunRequest {
  reserved 1, 2; // were language and code (single-file runs)
  repeated ProjectFile files = 5;
  string entry_file = 6; // path of the file to run, e.g. "main.py" or "src/app.js"
  string stdin = 3;
  string user_id = 4; // optional, empty for anonymous users
}

message ProjectFile {
  string path = 1; // relative path, e.g. "utils/greet.py"
  string content = 2;
}

message CreateRunResponse {
  string run_id = 1;
}

message GetRunRequest {
  string run_id = 1;
}

message Run {
  string id = 1;
  string language = 2;
  string status = 3; // queued | running (streamed only) | completed | timed_out | memory_exceeded | failed
  optional int32 exit_code = 4;
  string stdout = 5;
  string stderr = 6;
  bool truncated = 7;
  int32 time_ms = 8;
  string created_at = 9;  // ISO 8601
  string finished_at = 10; // ISO 8601, empty until finished
  string entry_file = 11;
}
