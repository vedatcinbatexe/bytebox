name: bytebox

services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bytebox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bytebox}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bytebox}']
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-bytebox}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-bytebox}
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379' # 6379 is often taken by a local Redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bytebox}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-bytebox}
    ports:
      - '5673:5672'
      - '15673:15672' # management UI
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Services ----------
  identity:
    restart: unless-stopped
    build: ./services/identity
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=identity;Username=${POSTGRES_USER:-bytebox};Password=${POSTGRES_PASSWORD:-bytebox}
      # GitHub / Google OAuth clients and the session secret come from .env (see .env.example)
      GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Jwt__Secret: ${JWT_SECRET:-dev-only-secret-please-set-JWT_SECRET-in-env}
      PublicUrl: http://localhost:5001
      WebUrl: http://localhost:3000
      DevLogin__Enabled: ${DEV_LOGIN_ENABLED:-false}
    ports:
      - '5001:8080'
    depends_on:
      postgres:
        condition: service_healthy

  execution:
    restart: unless-stopped
    build:
      context: . # repo root, so the build can read proto/
      dockerfile: services/execution/Dockerfile
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=execution;Username=${POSTGRES_USER:-bytebox};Password=${POSTGRES_PASSWORD:-bytebox}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Url: amqp://${RABBITMQ_USER:-bytebox}:${RABBITMQ_PASSWORD:-bytebox}@rabbitmq:5672
    ports:
      - '5002:8080' # REST (/health)
      - '50051:8081' # gRPC
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  project:
    restart: unless-stopped
    build: ./services/project
    environment:
      MONGO_URL: mongodb://${MONGO_USER:-bytebox}:${MONGO_PASSWORD:-bytebox}@mongo:27017
      MONGO_DB: bytebox
    ports:
      - '5003:8000'
    depends_on:
      mongo:
        condition: service_healthy

  runner:
    restart: unless-stopped
    build: ./services/runner
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-bytebox}:${RABBITMQ_PASSWORD:-bytebox}@rabbitmq:5672
    volumes:
      # The runner starts sandbox containers through the host's Docker
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      rabbitmq:
        condition: service_healthy
      sandbox-cpp:
        condition: service_completed_successfully
      sandbox-go:
        condition: service_completed_successfully

  # Builds the C++ sandbox image used by the runner, then exits
  sandbox-cpp:
    build: ./services/runner/images/cpp
    image: bytebox/sandbox-cpp
    command: ['true']

  # Builds the Go sandbox image (standard library pre-compiled), then exits
  sandbox-go:
    build: ./services/runner/images/go
    image: bytebox/sandbox-go
    command: ['true']

  terminal:
    restart: unless-stopped
    build: ./services/terminal
    environment:
      PORT: 4100
      WORKSPACE_IMAGE: bytebox/sandbox-workspace
      ALLOWED_ORIGINS: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-set-JWT_SECRET-in-env}
      IDLE_MINUTES: 15
      MAX_MINUTES: 60
    ports:
      - '4100:4100'
    volumes:
      # The terminal service starts workspace containers through the host's Docker
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-workspace:
        condition: service_completed_successfully

  # Server projects (Express, Spring Boot, ASP.NET Core): runs them in containers on private,
  # offline networks and shows them through a preview proxy
  devserver:
    restart: unless-stopped
    build: ./services/devserver
    environment:
      PORT: 4300
      PUBLIC_URL: http://localhost:4300
      ALLOWED_ORIGINS: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-set-JWT_SECRET-in-env}
      MAX_MINUTES: 30
    ports:
      - '4300:4300'
    volumes:
      # The devserver starts server containers through the host's Docker
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      server-node:
        condition: service_completed_successfully
      server-spring:
        condition: service_completed_successfully
      server-dotnet:
        condition: service_completed_successfully

  # Build the framework images used by the devserver (packages pre-installed, no internet at run time), then exit
  server-node:
    build: ./services/devserver/images/node
    image: bytebox/server-node
    command: ['true']
  server-spring:
    build: ./services/devserver/images/spring
    image: bytebox/server-spring
    command: ['true']
  server-dotnet:
    build: ./services/devserver/images/dotnet
    image: bytebox/server-dotnet
    command: ['true']

  # Live collaboration: shared Yjs documents over WebSocket, saved to the project service
  collab:
    restart: unless-stopped
    build: ./services/collab
    environment:
      PORT: 4200
      PROJECT_URL: http://project:8000
      ALLOWED_ORIGINS: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-set-JWT_SECRET-in-env}
    ports:
      - '4200:4200'
    depends_on:
      - project

  # Builds the workspace image used by terminal sessions, then exits
  sandbox-workspace:
    build: ./services/terminal/images/workspace
    image: bytebox/sandbox-workspace
    command: ['true']

  gateway:
    restart: unless-stopped
    build:
      context: . # repo root, so the build can read proto/
      dockerfile: services/gateway/Dockerfile
    environment:
      PORT: 4000
      IDENTITY_URL: http://identity:8080
      EXECUTION_GRPC_ADDRESS: execution:8081
      PROJECT_URL: http://project:8000
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_RUNS_PER_MINUTE: 60 # per user
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-set-JWT_SECRET-in-env}
      WEB_ORIGIN: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      - identity
      - execution
      - project
      - redis

  # ---------- Portals ----------
  web:
    restart: unless-stopped
    build:
      context: ./portals/web
      args:
        # Used by the browser, so it must be reachable from the user's machine
        NEXT_PUBLIC_GATEWAY_URL: http://localhost:4000/graphql
        NEXT_PUBLIC_TERMINAL_URL: ws://localhost:4100
        NEXT_PUBLIC_COLLAB_URL: ws://localhost:4200
        NEXT_PUBLIC_DEVSERVER_URL: ws://localhost:4300
        NEXT_PUBLIC_IDENTITY_URL: http://localhost:5001
    ports:
      - '3000:3000'
    depends_on:
      - gateway

volumes:
  postgres-data:
  mongo-data:
